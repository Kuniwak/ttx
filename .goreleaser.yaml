version: 2

builds:
  - id: ttx-human
    binary: ttx-human
    main: ./tools/ttx-human/main.go
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/Kuniwak/ttx/version.Version={{.Version}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

  - id: ttx-ai-recv
    binary: ttx-ai-recv
    main: ./tools/ttx-ai-recv/main.go
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/Kuniwak/ttx/version.Version={{.Version}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

  - id: ttx-ai-send
    binary: ttx-ai-send
    main: ./tools/ttx-ai-send/main.go
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/Kuniwak/ttx/version.Version={{.Version}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

  - id: ttx-slack
    binary: ttx-slack
    main: ./tools/ttx-slack/main.go
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/Kuniwak/ttx/version.Version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

  - id: ttx-slack-sup
    binary: ttx-slack-sup
    main: ./tools/ttx-slack-sup/main.go
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/Kuniwak/ttx/version.Version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
archives:
  - formats: ["tar.gz"]
    format_overrides:
      - goos: windows
        formats: ["zip"]

checksum:
  name_template: "checksums.txt"

release:
  prerelease: auto
